[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ssot-redact"
dynamic = ["version"]
description = "Redacts a folder of real files (names, emails, phone numbers) before it goes to an LLM or into an SSOT instance."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-docs"]
requires-python = ">=3.12"
dependencies = [
    # the readers of PDF, Word, Excel, mail, chats and the OCR are the ones of ssot-curator
    "ssot-curator @ git+https://github.com/Chiaf1/ssot-curator.git@v0.4.2",
    "pypdfium2>=4",      # renders scanned PDF pages for the OCR (Apache-2.0 / BSD-3)
    "click>=8.1",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ssot-redact = "ssot_redact.cli:main"

[tool.setuptools.packages.find]
include = ["ssot_redact*"]

[tool.setuptools.dynamic]
version = {attr = "ssot_redact.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
